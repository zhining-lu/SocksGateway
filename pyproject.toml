[project]
name = "socks-gateway"
version = "1.0.0"
description = "把本机 SOCKS5h 代理接成 Windows 系统代理的桌面网关"
requires-python = ">=3.10"
dependencies = ["pywebview>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pillow>=10", "pyinstaller>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
